name: Deploy to Development

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# One deploy at a time, so two runs can't interleave docker commands on the
# VPS. Deliberately NOT cancel-in-progress: runs queue in build-completion
# order, not commit order, so cancelling the running one can kill the newest
# image in favour of an older one that merely queued later.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: read
    environment:
      name: development
      url: https://${{ vars.DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BRANCH_REF="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            BRANCH_REF="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          fi

          SHORT_SHA="${SHA::7}"
          BRANCH_TAG="$(echo "$BRANCH_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[^a-z0-9_]+//; s/[^a-z0-9_]+$//')"
          if [ -z "$BRANCH_TAG" ]; then
            BRANCH_TAG="unknown"
          fi
          echo "IMAGE_TAG=${BRANCH_TAG}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "DEPLOY_SHA=${SHA}" >> "$GITHUB_ENV"

      # Merges landing close together finish building out of order, and each
      # build triggers its own deploy. Without this check the deploy that
      # finishes last wins, which is not necessarily the newest commit — that
      # is how dev ended up behind main on 2026-08-05. A superseded commit
      # bows out; the deploy for main's tip does the work.
      - name: Skip superseded commits
        id: freshness
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TIP="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$DEPLOY_SHA" != "$TIP" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy of ${DEPLOY_SHA::7}: main is now at ${TIP::7}"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: ${{ steps.freshness.outputs.superseded != 'true' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Development
        if: ${{ steps.freshness.outputs.superseded != 'true' }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "DEPLOY_PATH=${{ secrets.DEPLOY_PATH }} \
             REGISTRY=${{ env.REGISTRY }} \
             IMAGE_NAME=${{ env.IMAGE_NAME }} \
             GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
             GITHUB_ACTOR=${{ github.actor }} \
             bash -s" < deploy-scripts/deploy-instance.sh dev ${{ env.IMAGE_TAG }}

      - name: Verify deployment
        if: ${{ steps.freshness.outputs.superseded != 'true' }}
        run: |
          echo "Development deployed successfully!"
          echo "URL: https://${{ vars.DOMAIN }}"
